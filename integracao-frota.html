<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integração de Frota — EM Vidros</title>
<style>
/* ===================== TELA ===================== */
:root{
  --bg-app:#f5f7fa;--bg-side:#1a1d2e;--bg-side-hover:#2a2f47;
  --bg-card:#fff;--txt-main:#1a1d2e;--txt-dim:#6b7280;--txt-muted:#9ca3af;
  --border:#e5e7eb;--accent:#2563eb;--accent-soft:#dbeafe;
  --green:#16a34a;--green-soft:#dcfce7;
  --orange:#ea580c;--orange-soft:#ffedd5;
  --shadow:0 1px 3px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg-app);color:var(--txt-main);font-size:13px;display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{width:220px;background:var(--bg-side);color:#c8ccd6;display:flex;flex-direction:column;position:fixed;height:100vh;left:0;top:0;z-index:10;}
.brand{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand-name{font-weight:700;font-size:1rem;color:#fff;}
.brand-sub{font-size:.72rem;color:#7a8194;margin-top:3px;}
.nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-label{padding:8px 20px;font-size:.65rem;text-transform:uppercase;letter-spacing:.8px;color:#7a8194;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:.86rem;color:#c8ccd6;transition:.12s;border-left:3px solid transparent;}
.nav-item:hover{background:var(--bg-side-hover);color:#fff;}
.nav-item.ativo{background:var(--bg-side-hover);color:#fff;border-left-color:var(--accent);}
.sidebar-bottom{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:.72rem;color:#7a8194;}

.main{margin-left:220px;flex:1;display:flex;flex-direction:column;}
.topbar{background:var(--bg-card);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.topbar h1{font-size:1.05rem;font-weight:700;}
.content{padding:24px 28px;flex:1;max-width:960px;}

/* ABAS FUNÇÃO */
.funcao-tabs{display:flex;gap:10px;margin-bottom:20px;}
.funcao-btn{background:var(--bg-card);border:1.5px solid var(--border);border-radius:10px;padding:12px 24px;font-size:.92rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--txt-dim);transition:.12s;}
.funcao-btn.ativo{background:var(--accent);color:#fff;border-color:var(--accent);}

/* CARDS */
.card{background:var(--bg-card);border:1.5px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow);}
.card-titulo{font-size:.82rem;font-weight:700;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group.full{grid-column:1/-1;}
.form-group label{font-size:.72rem;font-weight:600;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.4px;}
.form-group input,.form-group select{background:var(--bg-app);border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:.9rem;color:var(--txt-main);font-family:inherit;width:100%;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent);}

/* SEMANAS */
.semana{background:var(--bg-card);border:1.5px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);}
.semana-header{background:var(--bg-side);color:#fff;padding:11px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.semana-num{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0;}
.semana-titulo{font-weight:700;font-size:.88rem;flex:1;}
.semana-prog{font-size:.75rem;opacity:.7;}
.semana-body{padding:14px 18px;display:flex;flex-direction:column;gap:8px;}

/* ATIVIDADES */
.atividade{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg-app);transition:.12s;}
.atividade.feita{background:var(--green-soft);border-color:#bbf7d0;}
.atividade input[type=checkbox]{width:17px;height:17px;flex-shrink:0;margin-top:1px;cursor:pointer;accent-color:var(--green);}
.atividade-texto{flex:1;font-size:.86rem;line-height:1.5;}
.atividade-titulo{font-weight:700;font-size:.84rem;display:block;margin-bottom:2px;}
.atividade-data{font-size:.75rem;color:var(--txt-dim);margin-left:auto;flex-shrink:0;}
.atividade-data input{background:transparent;border:none;border-bottom:1.5px solid var(--border);padding:2px 4px;font-size:.75rem;font-family:inherit;width:100px;color:var(--txt-dim);}
.atividade-data input:focus{outline:none;border-color:var(--accent);}

/* MATRIZ */
.matriz-table{width:100%;border-collapse:collapse;font-size:.83rem;}
.matriz-table th{background:var(--bg-side);color:#fff;padding:9px 12px;text-align:left;font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.4px;}
.matriz-table td{padding:9px 12px;border-bottom:1px solid var(--border);}
.matriz-table tr:last-child td{border-bottom:none;}
.badge-freq{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:700;}

/* BOTÕES */
.btn-gerar{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 26px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;transition:.12s;}
.btn-gerar:hover{opacity:.9;}
.btn-salvar{background:var(--green-soft);color:var(--green);border:1.5px solid #bbf7d0;border-radius:10px;padding:11px 22px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;transition:.12s;}
.btn-salvar:hover{background:var(--green);color:#fff;border-color:var(--green);}
.acoes{display:flex;gap:10px;flex-wrap:wrap;}

/* HISTÓRICO */
.hist-item{background:var(--bg-card);border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;box-shadow:var(--shadow);}
.hist-ico{font-size:1.4rem;}
.hist-info{flex:1;}
.hist-nome{font-weight:700;font-size:.9rem;}
.hist-sub{font-size:.75rem;color:var(--txt-dim);}
.hist-prog{font-size:.75rem;font-weight:700;}
.hist-prog.completo{color:var(--green);}
.hist-prog.parcial{color:var(--orange);}
.btn-carregar{background:var(--accent-soft);color:var(--accent);border:none;border-radius:7px;padding:6px 14px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s;}
.btn-carregar:hover{background:var(--accent);color:#fff;}

/* ===================== IMPRESSÃO ===================== */
@media print {
  @page { size: A4; margin: 15mm 18mm 15mm 18mm; }
  body { background:#fff; font-family:Arial,sans-serif; font-size:10pt; color:#000; display:block; }
  .sidebar,.topbar,.no-print { display:none !important; }
  .main { margin-left:0; }
  .content { max-width:100%; padding:0; }

  .print-doc { display:block !important; }

  /* CABEÇALHO */
  .ph { text-align:center; border-bottom:2pt solid #000; padding-bottom:10pt; margin-bottom:12pt; }
  .ph .empresa { font-size:14pt; font-weight:700; text-transform:uppercase; letter-spacing:2px; }
  .ph .doc-tipo { font-size:11pt; font-weight:700; margin-top:4pt; }
  .ph .doc-sub { font-size:9pt; color:#555; margin-top:2pt; }

  /* DADOS COLABORADOR */
  .pd { margin-bottom:14pt; }
  .pd-row { display:flex; gap:14pt; margin-bottom:5pt; }
  .pd-field { flex:1; }
  .pd-field .lbl { font-size:7.5pt; font-weight:700; text-transform:uppercase; color:#555; }
  .pd-field .val { font-size:10pt; border-bottom:1pt solid #000; padding-bottom:2pt; min-height:13pt; }

  /* SEMANAS */
  .ps { page-break-inside:avoid; margin-bottom:14pt; }
  .ps-header { background:#1a1d2e; color:#fff; padding:7pt 10pt; margin-bottom:6pt; }
  .ps-header span { font-weight:700; font-size:9.5pt; }
  .ps-item { display:flex; align-items:flex-start; gap:8pt; margin-bottom:5pt; padding:5pt 8pt; border:0.5pt solid #ccc; border-radius:3pt; }
  .ps-check { width:14pt; height:14pt; border:1.5pt solid #000; border-radius:2pt; flex-shrink:0; display:flex; align-items:center; justify-content:center; margin-top:1pt; font-size:11pt; }
  .ps-texto { flex:1; font-size:9pt; line-height:1.4; }
  .ps-titulo { font-weight:700; display:block; }
  .ps-data { font-size:8pt; color:#555; margin-left:8pt; flex-shrink:0; min-width:70pt; text-align:right; }

  /* MATRIZ */
  .pm { margin-bottom:14pt; }
  .pm-titulo { font-weight:700; font-size:10pt; border-bottom:1.5pt solid #000; padding-bottom:4pt; margin-bottom:8pt; }
  .pm-table { width:100%; border-collapse:collapse; font-size:9pt; }
  .pm-table th { background:#1a1d2e; color:#fff; padding:7pt 8pt; text-align:left; font-size:8pt; text-transform:uppercase; }
  .pm-table td { padding:6pt 8pt; border-bottom:0.5pt solid #ccc; }

  /* ASSINATURAS */
  .passin { page-break-before:auto; margin-top:20pt; border-top:1.5pt solid #000; padding-top:14pt; }
  .passin-titulo { font-weight:700; font-size:10pt; margin-bottom:16pt; }
  .passin-grid { display:grid; grid-template-columns:1fr 1fr; gap:20pt; }
  .passin-item { }
  .passin-linha { border-top:1pt solid #000; padding-top:4pt; margin-top:28pt; }
  .passin-nome { font-weight:700; font-size:9.5pt; }
  .passin-cargo { font-size:8pt; color:#555; }

  /* OCULTAR TELA */
  .card,.semana,.funcao-tabs,.acoes,.hist-item,.btn-carregar { display:none !important; }
  .print-doc { display:block !important; }
}
.print-doc { display:none; }
</style>
</head>

}

// ===================== ESTADO =====================
let funcaoAtual = 'motorista';
let progresso = {};
const KEY = 'emvidros_integracoes';

// ===================== INIT =====================
document.addEventListener('DOMContentLoaded', () => {
  const hoje = new Date().toISOString().split('T')[0];
  document.getElementById('f_admissao').value = hoje;
  document.getElementById('f_inicio').value = hoje;
  popularSelectColaborador('motorista');
  renderFuncao('motorista');
  renderHistorico();
});

// ===================== FUNÇÃO =====================
function selecionarFuncao(f) {
  funcaoAtual = f;
  document.getElementById('btnMotorista').classList.toggle('ativo', f==='motorista');
  document.getElementById('btnAjudante').classList.toggle('ativo', f==='ajudante');
  progresso = {};
  popularSelectColaborador(f);
  document.getElementById('f_nome').value  = '';
  document.getElementById('f_cargo').value = '';
  renderFuncao(f);
}

function renderFuncao(f) {
  const cfg = INTEGRACOES[f];
  renderSemanas(cfg);
  renderMatriz(cfg);
}

// ===================== SEMANAS =====================
function renderSemanas(cfg) {
  const c = document.getElementById('semanasContainer');
  c.innerHTML = '';
  cfg.semanas.forEach((sem, si) => {
    const total = sem.atividades.length;
    const feitas = sem.atividades.filter(a => progresso[a.id]?.feito).length;
    const div = document.createElement('div');
    div.className = 'semana no-print';
    div.innerHTML = `
      <div class="semana-header">
        <div class="semana-num">${si+1}</div>
        <div class="semana-titulo">${sem.titulo}</div>
        <div class="semana-prog">${feitas}/${total}</div>
      </div>
      <div class="semana-body" id="sem_body_${si}">
        ${sem.atividades.map(a => `
          <div class="atividade ${progresso[a.id]?.feito?'feita':''}" id="atv_${a.id}">
            <input type="checkbox" id="chk_${a.id}" ${progresso[a.id]?.feito?'checked':''} onchange="toggleAtividade('${a.id}', ${si})">
            <div class="atividade-texto">
              <span class="atividade-titulo">${a.titulo}</span>
              ${a.desc}
            </div>
            <div class="atividade-data">
              <input type="date" id="dt_${a.id}" value="${progresso[a.id]?.data||''}" placeholder="Data">
            </div>
          </div>`).join('')}
      </div>`;
    c.appendChild(div);
  });
}

function toggleAtividade(id, si) {
  const chk = document.getElementById('chk_'+id);
  const dt  = document.getElementById('dt_'+id);
  const el  = document.getElementById('atv_'+id);
  if (chk.checked) {
    if (!dt.value) dt.value = new Date().toISOString().split('T')[0];
    el.classList.add('feita');
  } else {
    el.classList.remove('feita');
  }
  if (!progresso[id]) progresso[id] = {};
  progresso[id].feito = chk.checked;
  progresso[id].data  = dt.value;
  // atualizar contador da semana
  const cfg = INTEGRACOES[funcaoAtual];
  const sem = cfg.semanas[si];
  const total = sem.atividades.length;
  const feitas = sem.atividades.filter(a => progresso[a.id]?.feito).length;
  const header = document.querySelector(`#sem_body_${si}`).previousElementSibling;
  header.querySelector('.semana-prog').textContent = `${feitas}/${total}`;
}

// ===================== MATRIZ =====================
function renderMatriz(cfg) {
  const t = document.getElementById('tabelaMatriz');
  t.innerHTML = `<thead><tr><th>Critério</th><th>Padrão Esperado</th><th>Frequência</th></tr></thead>
    <tbody>${cfg.matriz.map(m=>`<tr><td><b>${m.criterio}</b></td><td>${m.padrao}</td><td><span class="badge-freq">${m.freq}</span></td></tr>`).join('')}</tbody>`;
}

// ===================== SALVAR =====================
function salvarProgresso() {
  coletarProgresso();
  const id = Date.now().toString();
  let db; try { db = JSON.parse(localStorage.getItem(KEY))||{}; } catch { db={}; }
  const nome = document.getElementById('f_nome').value.trim() || 'Sem nome';
  const key = funcaoAtual + '_' + nome.replace(/\s+/g,'_');
  const cfg = INTEGRACOES[funcaoAtual];
  const totalAtv = cfg.semanas.reduce((s,sem)=>s+sem.atividades.length,0);
  const feitasAtv = Object.values(progresso).filter(p=>p.feito).length;
  db[key] = {
    funcao: funcaoAtual,
    nome,
    cargo:    document.getElementById('f_cargo').value,
    admissao: document.getElementById('f_admissao').value,
    inicio:   document.getElementById('f_inicio').value,
    coord:    document.getElementById('f_coord').value,
    gerente:  document.getElementById('f_gerente').value,
    rh:       document.getElementById('f_rh').value,
    progresso: {...progresso},
    total: totalAtv,
    feitas: feitasAtv,
    salvo_em: new Date().toISOString()
  };
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {}
  renderHistorico();
  alert('Progresso salvo com sucesso!');
}

function coletarProgresso() {
  const cfg = INTEGRACOES[funcaoAtual];
  cfg.semanas.forEach(sem => {
    sem.atividades.forEach(a => {
      const chk = document.getElementById('chk_'+a.id);
      const dt  = document.getElementById('dt_'+a.id);
      if (chk) progresso[a.id] = { feito: chk.checked, data: dt?.value||'' };
    });
  });
}

// ===================== HISTÓRICO =====================
function renderHistorico() {
  let db; try { db = JSON.parse(localStorage.getItem(KEY))||{}; } catch { db={}; }
  const el = document.getElementById('listaHistorico');
  const entries = Object.entries(db);
  if (entries.length === 0) {
    el.innerHTML = '<div style="color:var(--txt-muted);font-size:.85rem;">Nenhuma integração salva ainda.</div>';
    return;
  }
  el.innerHTML = entries.sort((a,b)=>b[1].salvo_em?.localeCompare(a[1].salvo_em)).map(([k,v]) => {
    const pct = Math.round((v.feitas/v.total)*100);
    const completo = pct === 100;
    return `<div class="hist-item">
      <div class="hist-ico">${v.funcao==='motorista'?'🚛':'📦'}</div>
      <div class="hist-info">
        <div class="hist-nome">${v.nome}</div>
        <div class="hist-sub">${v.funcao==='motorista'?'Motorista':'Ajudante'} · Início: ${fmtData(v.inicio)} · Coord: ${v.coord||'—'}</div>
      </div>
      <div class="hist-prog ${completo?'completo':'parcial'}">${pct}% (${v.feitas}/${v.total})</div>
      <button class="btn-carregar" onclick="carregarRegistro('${k}')">Carregar</button>
    </div>`;
  }).join('');
}

function carregarRegistro(key) {
  let db; try { db = JSON.parse(localStorage.getItem(KEY))||{}; } catch { db={}; }
  const v = db[key]; if (!v) return;
  funcaoAtual = v.funcao;
  progresso = {...v.progresso};
  document.getElementById('btnMotorista').classList.toggle('ativo', v.funcao==='motorista');
  document.getElementById('btnAjudante').classList.toggle('ativo', v.funcao==='ajudante');
  document.getElementById('f_nome').value    = v.nome||'';
  document.getElementById('f_cargo').value   = v.cargo||'';
  document.getElementById('f_admissao').value = v.admissao||'';
  document.getElementById('f_inicio').value  = v.inicio||'';
  document.getElementById('f_coord').value   = v.coord||'';
  document.getElementById('f_gerente').value = v.gerente||'';
  document.getElementById('f_rh').value      = v.rh||'';
  renderFuncao(v.funcao);
}

  const coord   = document.getElementById('f_coord').value;

  let html = `
    <div class="ph">
      <div class="empresa">EM Vidros Indústria e Comércio de Vidros Ltda</div>
      <div class="doc-tipo">Programa de Integração e Período de Experiência — 45 Dias</div>

    </div>
    <div class="pd">
      <div class="pd-row">
        <div class="pd-field"><div class="lbl">Colaborador</div><div class="val">${e(nome)}</div></div>
        <div class="pd-field"><div class="lbl">Cargo</div><div class="val">${e(cargo)}</div></div>
      </div>
      <div class="pd-row">
        <div class="pd-field"><div class="lbl">Data de Admissão</div><div class="val">${fmtData(admissao)}</div></div>
        <div class="pd-field"><div class="lbl">Início da Integração</div><div class="val">${fmtData(inicio)}</div></div>
      </div>
      <div class="pd-row">
        <div class="pd-field"><div class="lbl">Coordenador Responsável</div><div class="val">${e(coord)}</div></div>
        <div class="pd-field"><div class="lbl">Gerente de Logística</div><div class="val">${e(gerente)}</div></div>
        <div class="pd-field"><div class="lbl">Responsável RH</div><div class="val">${e(rh)}</div></div>
      </div>
    </div>`;

  cfg.semanas.forEach((sem, si) => {
    html += `<div class="ps">
      <div class="ps-header"><span>Semana ${si+1} — ${sem.titulo.split('—')[1]?.trim()||sem.titulo}</span></div>`;
    sem.atividades.forEach(a => {
      const p = progresso[a.id]||{};
      const check = p.feito ? '✓' : '';
      const data  = p.feito && p.data ? fmtData(p.data) : '';
      html += `<div class="ps-item">
        <div class="ps-check">${check}</div>
        <div class="ps-texto"><span class="ps-titulo">${e(a.titulo)}</span>${e(a.desc)}</div>
        <div class="ps-data">${data}</div>
      </div>`;
    });
    html += '</div>';
  });

  html += `<div class="pm">
    <div class="pm-titulo">Matriz de Avaliação Contínua</div>
    <table class="pm-table">
      <thead><tr><th>Critério</th><th>Padrão Esperado</th><th>Frequência</th></tr></thead>
      <tbody>${cfg.matriz.map(m=>`<tr><td><b>${e(m.criterio)}</b></td><td>${e(m.padrao)}</td><td>${e(m.freq)}</td></tr>`).join('')}</tbody>
    </table>
  </div>`;

  html += `<div class="passin">
    <div class="passin-titulo">Termo de Ciente e Assinaturas</div>
    <div style="font-size:9pt;margin-bottom:16pt;line-height:1.5;">
      Declaro que recebi o plano de integração para o período de experiência de 45 dias e estou ciente das atividades, treinamentos e responsabilidades descritas.<br><br>
      Data: ______ / ______ / __________
    </div>
    <div class="passin-grid">
      <div class="passin-item">
        <div class="passin-linha">
          <div class="passin-nome">${e(nome)}</div>
          <div class="passin-cargo">Colaborador (${funcaoAtual==='motorista'?'Motorista':'Ajudante'})</div>
        </div>
      </div>
      <div class="passin-item">
        <div class="passin-linha">
          <div class="passin-nome">${e(coord)}</div>
          <div class="passin-cargo">Coordenação Logística</div>
        </div>
      </div>
      <div class="passin-item">
        <div class="passin-linha">
          <div class="passin-nome">${e(gerente)}</div>
          <div class="passin-cargo">Gerência Logística</div>
        </div>
      </div>
      <div class="passin-item">
        <div class="passin-linha">
          <div class="passin-nome">${e(rh)}</div>
          <div class="passin-cargo">Recursos Humanos (RH)</div>
        </div>
      </div>

  document.getElementById('printDoc').innerHTML = html;
  window.print();
}

// ===================== HELPERS =====================
function fmtData(d) {
  if (!d) return '';
  const [a,m,dia] = d.split('-');
  return `${dia}/${m}/${a}`;
}
function e(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
