<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sistema de Indicadores · EM Vidros</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1e2530;color:#e6e9ef;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.caixa{background:#fff;color:#1f2937;border-radius:16px;padding:36px 40px;max-width:440px;
       box-shadow:0 20px 60px rgba(0,0,0,.3);}
h1{font-size:1.15rem;margin-bottom:14px;}
p{font-size:.92rem;line-height:1.55;color:#4b5563;}
p+p{margin-top:12px;}
</style>
</head>
<body>
  <div class="caixa">
    <h1>Este endereço saiu do ar</h1>
    <p>O sistema de indicadores passou a exigir login, e por isso deixou de funcionar
       como página aberta. Enquanto o endereço novo não entra no ar, fale com o Henrique.</p>
    <p>Nada foi perdido. O que você digitou continua guardado no seu navegador.</p>
  </div>
</body>
</html>
