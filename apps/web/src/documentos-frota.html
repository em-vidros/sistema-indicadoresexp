<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentos Frota — EM Vidros</title>
<style>
:root{
  --bg-app:#f5f7fa;--bg-side:#1a1d2e;--bg-side-hover:#2a2f47;
  --bg-card:#fff;--txt-main:#1a1d2e;--txt-dim:#6b7280;--txt-muted:#9ca3af;
  --border:#e5e7eb;--accent:#2563eb;--accent-soft:#dbeafe;
  --green:#16a34a;--green-soft:#dcfce7;
  --orange:#ea580c;--orange-soft:#ffedd5;
  --red:#dc2626;--red-soft:#fee2e2;
  --yellow:#ca8a04;--yellow-soft:#fef9c3;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg-app);color:var(--txt-main);font-size:13px;display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--bg-side);color:#c8ccd6;display:flex;flex-direction:column;position:fixed;height:100vh;left:0;top:0;z-index:10;}
.brand{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand-name{font-weight:700;font-size:1rem;color:#fff;}
.brand-sub{font-size:.72rem;color:#7a8194;margin-top:3px;}
.nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-label{padding:8px 20px;font-size:.65rem;text-transform:uppercase;letter-spacing:.8px;color:#7a8194;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:.86rem;color:#c8ccd6;transition:.12s;border-left:3px solid transparent;}
.nav-item:hover{background:var(--bg-side-hover);color:#fff;}
.nav-item.ativo{background:var(--bg-side-hover);color:#fff;border-left-color:var(--accent);}
.nav-item .ico{width:18px;text-align:center;font-size:1rem;}
.sidebar-bottom{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:.72rem;color:#7a8194;}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;}
.topbar{background:var(--bg-card);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.topbar h1{font-size:1.05rem;font-weight:700;}
.content{padding:24px 28px;flex:1;}

/* SEÇÕES */
.secao{margin-bottom:28px;}
.secao-titulo{font-size:.82rem;font-weight:700;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.secao-titulo::after{content:'';flex:1;height:1px;background:var(--border);}

/* GRID */
.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.doc-card{background:var(--bg-card);border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:.12s;}
.doc-card:hover{border-color:var(--accent);}
.doc-card-header{display:flex;align-items:flex-start;gap:10px;}
.doc-ico{font-size:1.4rem;flex-shrink:0;}
.doc-titulo{font-weight:700;font-size:.88rem;}
.doc-sub{font-size:.75rem;color:var(--txt-dim);}
.doc-status{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:.72rem;font-weight:700;width:fit-content;}
.status-ok{background:var(--green-soft);color:var(--green);}
.status-alerta{background:var(--yellow-soft);color:var(--yellow);}
.status-vencido{background:var(--red-soft);color:var(--red);}
.status-sem-data{background:var(--bg-app);color:var(--txt-muted);border:1px solid var(--border);}
.doc-actions{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}
.btn-sm{border:none;border-radius:6px;padding:5px 12px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s;}
.btn-ver{background:var(--accent-soft);color:var(--accent);}
.btn-ver:hover{background:var(--accent);color:#fff;}
.btn-edit{background:var(--bg-app);border:1.5px solid var(--border);color:var(--txt-dim);}
.btn-edit:hover{border-color:var(--accent);color:var(--accent);}
.btn-upload{background:var(--green-soft);color:var(--green);}
.btn-upload:hover{background:var(--green);color:#fff;}
input[type=file]{display:none;}

/* RESUMO */
.resumo-chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.chip{background:var(--bg-card);border:1.5px solid var(--border);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:8px;}
.chip-num{font-size:1.3rem;font-weight:800;}
.chip-label{font-size:.75rem;color:var(--txt-dim);}
.chip-red .chip-num{color:var(--red);}
.chip-yellow .chip-num{color:var(--yellow);}
.chip-green .chip-num{color:var(--green);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;display:none;align-items:center;justify-content:center;}
.modal-overlay.aberto{display:flex;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-header{background:var(--bg-side);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-header h3{font-size:.95rem;font-weight:700;}
.modal-close{background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;opacity:.7;}
.modal-close:hover{opacity:1;}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;}
.btn-salvar{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-cancelar{background:var(--bg-app);color:var(--txt-dim);border:1.5px solid var(--border);border-radius:8px;padding:9px 16px;font-size:.88rem;cursor:pointer;font-family:inherit;}
.modal-sec-titulo{font-weight:700;font-size:.78rem;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px;}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.modal-upload-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg-app);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:6px;}
.btn-upload-doc{padding:5px 10px;border:1.5px solid var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--accent);cursor:pointer;font-size:.78rem;font-family:inherit;font-weight:600;white-space:nowrap;}
.btn-upload-doc:hover{background:var(--accent);color:#fff;}
.inp{background:var(--bg-app);border:1.5px solid var(--border);border-radius:8px;padding:8px 11px;font-size:.88rem;color:var(--txt-main);font-family:inherit;width:100%;}
.inp:focus{outline:none;border-color:var(--accent);}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.form-group label{font-size:.75rem;font-weight:600;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.4px;}
.form-group input,.form-group select{background:var(--bg-app);border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:.9rem;color:var(--txt-main);font-family:inherit;width:100%;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent);}
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;font-size:.83rem;color:var(--txt-dim);}
.upload-zone:hover{border-color:var(--accent);background:var(--accent-soft);}

/* LINHA DE DOCUMENTO NO CARD */
.doc-linha{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--border);}
.doc-linha:last-child{border-bottom:none;}
.doc-linha-label{flex:1;font-size:.8rem;font-weight:600;}
.doc-linha-seg{font-size:.68rem;color:var(--txt-dim);font-weight:400;margin-left:4px;}
.doc-linha-btns{display:flex;gap:4px;align-items:center;}
.btn-doc{padding:4px 8px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg-app);cursor:pointer;font-size:.72rem;font-family:inherit;font-weight:600;color:var(--txt-dim);transition:.12s;white-space:nowrap;}
.btn-doc:hover{border-color:var(--accent);color:var(--accent);}
.btn-doc.importar{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.btn-doc.importar:hover{background:var(--accent);color:#fff;}
.btn-doc.tem-arquivo{border-color:var(--green);color:var(--green);background:var(--green-soft);}

/* MANUAL ITEM */
.manual-item{background:var(--bg-card);border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.manual-item:hover{border-color:var(--accent);}
.manual-info{flex:1;}
.manual-titulo{font-weight:700;font-size:.88rem;}
.manual-sub{font-size:.75rem;color:var(--txt-dim);}
.manual-lista{display:flex;flex-direction:column;gap:8px;}

@media(max-width:768px){.main{margin-left:0;} .docs-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="brand">
    <div class="brand-name"><img src="docs/logo-emvidros.svg" alt="EM Vidros" style="height:56px;width:auto;display:block;"></div>
    <div class="brand-sub">Documentos Frota</div>
  </div>
  <div class="nav">
    <div class="nav-label">Módulos</div>
    <div class="nav-item" onclick="window.location='formulario-registro.html'"><span class="ico">✏️</span> Registro Diário</div>
    <div class="nav-item" onclick="window.location='dashboard-semanal.html'"><span class="ico">📊</span> Dashboard</div>
    <div class="nav-item" onclick="window.location='manutencao-frota.html'"><span class="ico">🔧</span> Manutenção Frota</div>
    <div class="nav-item ativo"><span class="ico">📂</span> Documentos</div>
    <div class="nav-item" onclick="window.location='ata-reuniao.html'"><span class="ico">📝</span> Ata de Reunião</div>
    <div class="nav-item" onclick="window.location='integracao-frota.html'"><span class="ico">🧑‍🏫</span> Integração</div>
  </div>
  <div class="sidebar-bottom">v1.0 · Ago 2026</div>
</nav>

<main class="main">
  <div class="topbar">
    <div><h1>Documentos da Frota</h1><div style="font-size:.8rem;color:var(--txt-dim);" id="dataAtual"></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <select id="filtroBase" style="border:1.5px solid var(--border);border-radius:8px;padding:7px 12px;font-size:.85rem;font-family:inherit;background:var(--bg-card);" onchange="renderTudo()">
        <option value="Raposa">📍 Raposa</option>
        <option value="Imperatriz">📍 Imperatriz</option>
        <option value="Belém">📍 Belém</option>
      </select>
    </div>
  </div>

  <div class="content">
    <!-- RESUMO -->
    <div class="resumo-chips" id="resumoChips"></div>

    <!-- MANUAIS DOS FABRICANTES -->
    <div class="secao">
      <div class="secao-titulo">📖 Manuais dos Fabricantes</div>
      <div class="manual-lista" id="listaManuals"></div>
    </div>

    <!-- PLANO DE MANUTENÇÃO -->
    <div class="secao">
      <div class="secao-titulo">📋 Plano de Manutenção Preventiva</div>
      <div class="docs-grid" id="gradeplantas"></div>
    </div>

    <!-- DOCUMENTOS DOS VEÍCULOS -->
    <div class="secao">
      <div class="secao-titulo">🚛 Documentos dos Veículos</div>
      <div class="docs-grid" id="gradeVeiculos"></div>
    </div>

    <!-- DOCUMENTOS DOS MOTORISTAS -->
    <div class="secao">
      <div class="secao-titulo">👤 CNH dos Motoristas</div>
      <div class="docs-grid" id="gradeMotoristas"></div>
    </div>
  </div>
</main>

<!-- INPUT GLOBAL DE UPLOAD DE DOCUMENTOS -->
<input type="file" id="inputDocCard" accept=".pdf,image/*" style="display:none" onchange="onDocCardChange(this)">

<!-- MODAL EDITAR DOCUMENTO -->
<div class="modal-overlay" id="modalDoc">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalDocTitulo">Editar Documento</h3>
      <button class="modal-close" onclick="fecharModalDoc()">✕</button>
    </div>
    <div class="modal-body" id="modalDocBody"></div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModalDoc()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarDoc()">💾 Salvar</button>
    </div>
  </div>
</div>

<script>
// ===================== CONFIG =====================
const DOC_KEY = 'emvidros_documentos';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUXXAoZeuvTYm3s9Buj3ocnPH9vNitZ30XBcM696qp0r0wkiUE-Ubsr7uPde0X0l_spA/exec';

const VEICULOS_INFO = {
  'PTV0006': { modelo:'ATEGO 3030 CE',  marca:'Mercedes-Benz', ano:'2019/2020' },
  'PTT0004': { modelo:'ACCELO 1316',    marca:'Mercedes-Benz', ano:'2019/2020' },
  'ROW3A87': { modelo:'26.260 CRM 6x2', marca:'Volkswagen',    ano:'2023/2024' },
  'SM02J13': { modelo:'ATEGO 2429',     marca:'Mercedes-Benz', ano:'2024/2025' },
  'SMP6F86': { modelo:'ATEGO 2429',     marca:'Mercedes-Benz', ano:'2024/2025' },
  'SMW0B96': { modelo:'ATEGO 2429',     marca:'Mercedes-Benz', ano:'2024/2025' },
  'SMQ2I80': { modelo:'ACCELO 1017',    marca:'Mercedes-Benz', ano:'2024/2024' },
  'DMG9D41': { modelo:'—', marca:'—', ano:'—' },
  'NXD4H26': { modelo:'—', marca:'—', ano:'—' },
  'NXB2H55': { modelo:'—', marca:'—', ano:'—' },
  'ROW4J37': { modelo:'—', marca:'—', ano:'—' },
  'SMR2H61': { modelo:'—', marca:'—', ano:'—' },
  'SND9C34': { modelo:'—', marca:'—', ano:'—' },
  'SMM4A02': { modelo:'—', marca:'—', ano:'—' },
  'SMP2F01': { modelo:'—', marca:'—', ano:'—' },
};

const MOTORISTAS_RAPOSA = ['Anderson Penha Dos Anjos','Gabriel Reis Costa','Leandro do Nascimento Brito','Raimundo Correia Ferreira','Raimundo Nonato da Silva Divino','Saturnino Assumpção Dias Filho','Silio Vinicius Cruz Castro','Victor Gonçalves Vasconcelos'];
const MOTORISTAS_IMPERATRIZ = ['Nataniel Pereira Rocha','Francisco Pereira dos Santos','Evandro de Oliveira Cardim','Francisco de Sousa Cabral','Adriel da Silva Santos','Sebastiao de Brito Matos','Italo Melo Sales','Railton da Silva Batista'];
const MOTORISTAS_BELEM = ['Severino Manoel Barata do Nascimento'];

const VEICULOS_RAPOSA     = ['PTV0006','PTT0004','ROW3A87','SMW0B96','SM02J13','SMP6F86','SMQ2I80'];
const VEICULOS_IMPERATRIZ = ['DMG9D41','NXD4H26','NXB2H55','ROW4J37','SMR2H61','SND9C34','SMM4A02'];
const VEICULOS_BELEM      = ['SMP2F01'];

// Manuais dos fabricantes — Raposa
const MANUAIS_RAPOSA = [
  { titulo:'Manual ATEGO 2429 / 3030 CE',        marca:'Mercedes-Benz', modelos:'ATEGO 2429 · ATEGO 3030 CE',        placas:'SM02J13, SMP6F86, SMW0B96, PTV0006', url:'docs/manual-atego.pdf' },
  { titulo:'Manual ACCELO 1316 (Euro V)',         marca:'Mercedes-Benz', modelos:'ACCELO 1316 (Euro V)',              placas:'PTT0004',                             url:'docs/manual-accelo-euro-v.pdf' },
  { titulo:'Manual ACCELO 1017 (Euro VI)',        marca:'Mercedes-Benz', modelos:'ACCELO 1017 (Euro VI)',             placas:'SMQ2I80',                             url:'docs/manual-accelo-euro-vi.pdf' },
  { titulo:'Manual 26.260 CRM 6x2',              marca:'Volkswagen',    modelos:'26.260 CRM 6x2',                    placas:'ROW3A87',                             url:'docs/manual-volks.pdf' },
];

// Planos de manutenção
const PLANOS = [
  { titulo:'PGQ MAN — Programa de Manutenção Preventiva 2026', descricao:'Cronograma anual assinado — todos os veículos Raposa', url:'docs/pgq-manutencao-2026.pdf', tipo:'plano' },
];

// Arquivos disponíveis por placa (vencimento pré-setado para cálculo de alerta)
const DOCS_ESTATICOS = {
  'PTV0006': { seguradora:'Bradesco', apolice_url:'docs/apolice-PTV0006.pdf', apolice_venc:'2026-12-26', tacografo_url:'docs/tacografo-PTV0006.pdf' },
  'PTT0004': { seguradora:'MAPFRE',   apolice_url:'docs/apolice-PTT0004.pdf', apolice_venc:'2026-08-31', tacografo_url:'docs/tacografo-PTT0004.pdf' },
  'ROW3A87': { seguradora:'Bradesco', apolice_url:'docs/apolice-ROW3A87.pdf', apolice_venc:'2026-09-11', tacografo_url:'docs/tacografo-ROW3A87.pdf' },
  'SM02J13': { seguradora:'MAPFRE',   apolice_url:'docs/apolice-SM02J13.pdf', apolice_venc:'2026-06-14', tacografo_url:'docs/tacografo-SM02J13.pdf' },
  'SMP6F86': { seguradora:'MAPFRE',   apolice_url:'docs/apolice-SMP6F86.pdf', apolice_venc:'2026-06-12', tacografo_url:'docs/tacografo-SMP6F86.pdf' },
  'SMW0B96': { seguradora:'Bradesco', apolice_url:'docs/apolice-SMW0B96.pdf', apolice_venc:'2026-12-11', tacografo_url:'docs/tacografo-SMW0B96.pdf' },
  'SMQ2I80': { seguradora:'Bradesco', apolice_url:'docs/apolice-SMQ2I80.pdf', apolice_venc:'2027-07-17', tacografo_url:'docs/tacografo-SMQ2I80.pdf' },
};

// ===================== ESTADO =====================
let docsCfg = {};
let editandoKey = null;

// ===================== INIT =====================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('dataAtual').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  carregarDocs();
  renderTudo();
});

function carregarDocs() {
  try { docsCfg = JSON.parse(localStorage.getItem(DOC_KEY)) || {}; } catch { docsCfg = {}; }
}

function salvarDocs() {
  try { localStorage.setItem(DOC_KEY, JSON.stringify(docsCfg)); } catch {}
}

// ===================== UTILITÁRIOS =====================
function getBase() { return document.getElementById('filtroBase').value; }

function veiculosDaBase(base) {
  return base==='Raposa' ? VEICULOS_RAPOSA : base==='Imperatriz' ? VEICULOS_IMPERATRIZ : VEICULOS_BELEM;
}

function motoristasBase(base) {
  return base==='Raposa' ? MOTORISTAS_RAPOSA : base==='Imperatriz' ? MOTORISTAS_IMPERATRIZ : MOTORISTAS_BELEM;
}

function diasAteVencer(dataStr) {
  if (!dataStr) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const venc = new Date(dataStr + 'T00:00:00');
  return Math.round((venc - hoje) / 86400000);
}

function statusVencimento(dataStr, alertaDias) {
  const dias = diasAteVencer(dataStr);
  if (dias === null) return 'sem-data';
  if (dias < 0)           return 'vencido';
  if (dias <= alertaDias) return 'alerta';
  return 'ok';
}

function statusLabel(dataStr, alertaDias) {
  const dias = diasAteVencer(dataStr);
  if (dias === null) return { cls:'status-sem-data', txt:'Sem data' };
  if (dias < 0)     return { cls:'status-vencido',  txt:`Vencido há ${Math.abs(dias)} dias` };
  if (dias <= alertaDias) return { cls:'status-alerta', txt:`Vence em ${dias} dias` };
  return { cls:'status-ok', txt:`${dias} dias restantes` };
}

// ===================== RESUMO =====================
function renderResumo() {
  const base = getBase();
  const veiculos = veiculosDaBase(base);
  const motoristas = motoristasBase(base);
  let vencidos = 0, alertas = 0, ok = 0;

  const tiposVeiculo = ['tacografo','seguro','crlv'];
  veiculos.forEach(pl => {
    tiposVeiculo.forEach(t => {
      const d = docsCfg[pl]?.[t];
      const alerta = t==='tacografo' ? 30 : 60;
      const s = statusVencimento(d?.vencimento, alerta);
      if (s==='vencido') vencidos++;
      else if (s==='alerta') alertas++;
      else if (s==='ok') ok++;
    });
  });
  motoristas.forEach(m => {
    const d = docsCfg['moto_'+m]?.cnh;
    const s = statusVencimento(d?.vencimento, 60);
    if (s==='vencido') vencidos++;
    else if (s==='alerta') alertas++;
    else if (s==='ok') ok++;
  });

  document.getElementById('resumoChips').innerHTML = `
    <div class="chip chip-red"><span class="chip-num">${vencidos}</span><span class="chip-label">Vencidos</span></div>
    <div class="chip chip-yellow"><span class="chip-num">${alertas}</span><span class="chip-label">Próximos<br>do vencimento</span></div>
    <div class="chip chip-green"><span class="chip-num">${ok}</span><span class="chip-label">Em dia</span></div>
  `;
}

// ===================== MANUAIS =====================
function renderManuais() {
  const base = getBase();
  const manuais = base === 'Raposa' ? MANUAIS_RAPOSA : [];
  const el = document.getElementById('listaManuals');
  if (manuais.length === 0) {
    el.innerHTML = '<div style="color:var(--txt-muted);font-size:.85rem;padding:8px 0;">Manuais não configurados para esta base ainda.</div>';
    return;
  }
  el.innerHTML = manuais.map((m) => `
    <div class="manual-item">
      <div style="font-size:1.8rem;">📖</div>
      <div class="manual-info">
        <div class="manual-titulo">${m.titulo}</div>

// ===================== UPLOAD DE DOCUMENTOS (CARD) =====================
let _docPdfs  = {};
let _uploadCtx = { placa: null, tipo: null };

function importarDocCard(placa, tipo) {
  _uploadCtx = { placa, tipo };
  const inp = document.getElementById('inputDocCard');
  inp.value = '';
  inp.click();
}

function onDocCardChange(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 6 * 1024 * 1024) { alert('Arquivo muito grande (máx 6 MB).'); input.value=''; return; }
  const { placa, tipo } = _uploadCtx;
  const reader = new FileReader();
  reader.onload = e => {
    if (!docsCfg[placa]) docsCfg[placa] = {};
    if (!docsCfg[placa][tipo]) docsCfg[placa][tipo] = {};
    docsCfg[placa][tipo].pdfB64  = e.target.result;
    docsCfg[placa][tipo].nomeArq = file.name;
    salvarDocs();
    renderTudo();
  };
  reader.readAsDataURL(file);
}

function srcDocCard(placa, tipo) {
  const d   = docsCfg[placa] || {};
  const est = DOCS_ESTATICOS[placa] || {};
  if (tipo === 'seguro')    return d.seguro?.pdfB64    || est.apolice_url    || '';
  if (tipo === 'tacografo') return d.tacografo?.pdfB64 || est.tacografo_url  || '';
  if (tipo === 'crlv')      return d.crlv?.pdfB64      || d.crlv?.link       || '';
  return '';
}

function verDocCard(placa, tipo) {
  const src = srcDocCard(placa, tipo);
  if (!src) return;
  if (src.startsWith('data:')) {
    const w = window.open('', '_blank');
    w.document.write(`<html><body style="margin:0"><iframe src="${src}" style="width:100%;height:100vh;border:none;"></iframe></body></html>`);
    w.document.close();
  } else {
    window.open(src, '_blank');
  }
}

function baixarDocCard(placa, tipo) {
  const src = srcDocCard(placa, tipo);
  if (!src) return;
  const d = docsCfg[placa] || {};
  const nomeBase = d[tipo]?.nomeArq || `${placa}-${tipo}.pdf`;
  const a = document.createElement('a');
  a.href = src;
  a.download = nomeBase;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Funções do modal (upload dentro do modal — mantido por retrocompatibilidade)
function escolherArquivoDoc(inputId) { document.getElementById(inputId)?.click(); }
function onDocFileChange(input, tipo) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 6 * 1024 * 1024) { alert('Máx 6 MB.'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    _docPdfs[tipo] = e.target.result;
    const el = document.getElementById(tipo + 'PdfNome');
    if (el) el.textContent = '✅ ' + file.name;
  };
  reader.readAsDataURL(file);
}
function abrirB64(tipo, cfg) { verDocCard(modalPlaca, tipo); }

function abrirModalMotorista(nome) {

    </div>`;

function salvarDoc() {
  if (modalTipo==='manual') {
    const link = document.getElementById('docLink').value.trim();
    if (!docsCfg['manual_'+modalIdx]) docsCfg['manual_'+modalIdx] = {};
    docsCfg['manual_'+modalIdx].link = link;
  }
  if (modalTipo==='plano') {
    const link = document.getElementById('docLink').value.trim();
    if (!docsCfg['plano_'+modalIdx]) docsCfg['plano_'+modalIdx] = {};
    docsCfg['plano_'+modalIdx].link = link;
  }
  if (modalTipo==='veiculo') {
    if (!docsCfg[modalPlaca]) docsCfg[modalPlaca] = {};
    const prev = docsCfg[modalPlaca];
    docsCfg[modalPlaca].seguradora = document.getElementById('seguradora').value;
    docsCfg[modalPlaca].emergencia = document.getElementById('segEmerg').value.trim();
    docsCfg[modalPlaca].seguro     = {
      vencimento: document.getElementById('segVenc').value,
      link:       prev.seguro?.link || '',
      pdfB64:     _docPdfs['seg'] || prev.seguro?.pdfB64 || ''
    };
    docsCfg[modalPlaca].tacografo  = {
      vencimento: document.getElementById('tacVenc').value,
      link:       prev.tacografo?.link || '',
      pdfB64:     _docPdfs['tac'] || prev.tacografo?.pdfB64 || ''
    };
    docsCfg[modalPlaca].crlv       = {
      vencimento: document.getElementById('crlvVenc').value,
      link:       prev.crlv?.link || '',
      pdfB64:     _docPdfs['crlv'] || prev.crlv?.pdfB64 || ''
    };
    _docPdfs = {};
  }
  if (modalTipo==='motorista') {
    const key = 'moto_' + modalMotorista;
    if (!docsCfg[key]) docsCfg[key] = {};
    docsCfg[key].cnh = {
      numero:    document.getElementById('cnhNum').value.trim(),
      categoria: document.getElementById('cnhCat').value,
      vencimento:document.getElementById('cnhVenc').value,
      link:      document.getElementById('cnhLink').value.trim(),
    };
  }
  salvarDocs();
  fecharModalDoc();
  renderTudo();
}

function fecharModalDoc() {
  document.getElementById('modalDoc').classList.remove('aberto');
  modalTipo=modalIdx=modalPlaca=modalMotorista=null;
}

// ===================== RENDER TUDO =====================
function renderTudo() {
  renderResumo();
  renderManuais();
  renderPlanos();
  renderVeiculos();
  renderMotoristas();
}

// Atalho: input de estilo
document.querySelectorAll('.form-group input, .form-group select').forEach(el => {
